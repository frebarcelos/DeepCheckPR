services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./cache:/app/cache
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      streamlit run src/pr_analyzer/ui/app.py
      --server.address=0.0.0.0
      --server.maxUploadSize=${MAX_UPLOAD_SIZE_MB:-10240}

  test:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    command: pytest tests/ -m "not integration" --tb=short -q
    profiles:
      - test               # executa apenas com: docker compose --profile test up test

  lint:
    build: .
    volumes:
      - .:/app
    command: >
      sh -c "ruff check src/ tests/ && ruff format --check src/ tests/"
    profiles:
      - lint
