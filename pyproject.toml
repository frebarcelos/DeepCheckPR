[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-analyzer"
version = "0.1.0"
description = "GitHub PR Analysis Tool — Functional Programming Paradigm"
requires-python = ">=3.11"
dependencies = [
    "agno>=1.4",
    "streamlit>=1.35",
    "plotly>=5.20",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "groq>=0.9",
    "streamlit-extras>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff: linting e formatação ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes (variáveis não usadas, imports não usados)
  "I",    # isort (ordem de imports)
  "UP",   # pyupgrade (sintaxe moderna Python 3.11+)
  "B",    # flake8-bugbear (bugs comuns e más práticas)
  "C4",   # flake8-comprehensions (simplificação de comprehensions)
  "C90",  # mccabe (complexidade ciclomática — funções complexas)
  "N",    # pep8-naming (convenções de nomenclatura)
  "SIM",  # flake8-simplify (código desnecessariamente complexo)
  "T20",  # flake8-print (detecta print() esquecido)
  "PT",   # flake8-pytest-style (boas práticas em testes)
  "RUF",  # regras específicas do Ruff
]
ignore = [
  "E501",   # line too long — controlado pelo formatter
  "N803",   # argument name should be lowercase (conflita com lambdas)
  "SIM108", # ternary operator (às vezes reduz legibilidade)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "S101", "PT011", "T20", "E731"]
"scripts/**" = ["T20", "N802"]  # print é intencional em CLIs; N802 para visitors AST

# ── Mypy: type checking estrito ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/pr_analyzer --cov-report=term-missing -q --no-header"
markers = [
    "integration: testes que chamam APIs LLM externas (pular com -m 'not integration')",
    "slow: testes demorados",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/pr_analyzer"]
omit = [
    "src/pr_analyzer/ui/*",
    "src/pr_analyzer/llm/client.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
