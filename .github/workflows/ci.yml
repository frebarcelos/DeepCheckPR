name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/
      - name: Mypy
        run: mypy --no-site-packages src/
      - name: Paradigma funcional
        run: python -X utf8 scripts/check_paradigm.py

  tests:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Executar suíte e cobertura
        run: >-
          pytest tests/ -m "not integration"
          --cov=src/pr_analyzer
          --cov-fail-under=80
          --tb=short
